
# resources/jobs.yaml (corrected)
resources:
  jobs:
    etl_job:
      name: ${bundle.name}-etl-${bundle.target}
      tasks:
        - task_key: run_books
          notebook_task:
            notebook_path: ${workspace.file_path}/codebase1/BooksAPI.py
            base_parameters:
              env: ${bundle.target}

        - task_key: run_chatbot
          depends_on:
            - task_key: run_books
          notebook_task:
            notebook_path: ${workspace.file_path}/codebase1/chatbotllm.py
            base_parameters:
              env: ${bundle.target}
