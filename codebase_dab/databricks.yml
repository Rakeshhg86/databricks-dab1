# This is a Databricks asset bundle definition for codebase_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: codebase_dab
  uuid: 5c16099e-fe94-49c9-8b90-fd42558ae630

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405610865065372.12.azuredatabricks.net
    variables:
      catalog: workspace9_1
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405610865065372.12.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/rakesh_nlp@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rakesh_nlp@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace9_1
      schema: prod
    permissions:
      - user_name: rakesh_nlp@outlook.com
        level: CAN_MANAGE
